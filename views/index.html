<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-page="Home">alwazir</title>
  <meta name="description" content="Alwazir — luxury perfume oils. Explore our collection of oud, musk, amber and floral perfume oils.">
  <link rel="icon" type="image/png" href="/img/seed/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img class="brand-logo hidden" data-logo alt="logo">
        <span class="brand-name gold-text" data-brand>alwazir</span>
      </a>
      <div class="header-actions">
        <button class="cart-btn" data-cart-open aria-label="Open cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          Cart
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero / search -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-brand gold-text" data-brand>alwazir</h1>
      <p class="hero-tagline" data-tagline></p>
      <form class="search-wrap" data-search-form>
        <input type="text" name="q" placeholder="Search for a perfume oil…" autocomplete="off" data-search-input>
        <button type="submit" class="search-btn">Search</button>
      </form>
    </div>
  </section>

  <!-- Special offer (only shown if admin set a special product) -->
  <section class="special-section hidden" data-special-section>
    <div class="container">
      <div class="special-card">
        <div class="special-media" data-special-media></div>
        <div class="special-info">
          <span class="special-flag">&#10024; Special Offer</span>
          <h3 data-special-name></h3>
          <p class="special-desc" data-special-desc></p>
          <div class="product-price" data-special-price></div>
          <div class="details-actions">
            <button class="btn btn-gold" data-action="add" data-special-add>Add to Cart</button>
            <button class="btn btn-whatsapp" data-action="chat" data-special-chat>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Chat
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Catalog (2 products per full-screen row) -->
  <main class="catalog">
    <div class="container">
      <h2 class="section-title gold-text">Our Collection</h2>
      <p class="section-sub" data-catalog-sub>Discover handcrafted perfume oils, shown two at a time. Scroll to reveal more.</p>
      <div class="grid" data-grid></div>
      <div class="empty-state hidden" data-empty>
        <div class="big">&#128148;</div>
        <h3>No products found</h3>
        <p>Try a different search, or check back soon.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="brand-name gold-text" data-brand>alwazir</div>
      <p>&copy; <span data-year></span> <span data-brand>alwazir</span> — Luxury Perfume Oils. All rights reserved.</p>
    </div>
  </footer>

  <!-- Cart drawer -->
  <div class="overlay" data-cart-overlay></div>
  <aside class="cart-drawer" data-cart-drawer aria-label="Shopping cart">
    <div class="cart-head">
      <h3>Your Cart</h3>
      <button class="close-btn" data-cart-close aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-items" data-cart-items></div>
    <div class="cart-foot">
      <div class="cart-total-row">Total <span class="amount" data-cart-total></span></div>
      <button class="btn btn-whatsapp btn-block" data-whatsapp-order>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Chat &amp; Order on WhatsApp
      </button>
      <button class="btn btn-outline btn-block" data-cart-clear>Clear Cart</button>
    </div>
  </aside>

  <script src="/js/app.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
